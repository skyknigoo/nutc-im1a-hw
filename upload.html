<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業上傳</title>
    <!-- 引入 SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
            background: #fff;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        #studentTip {
            margin-top: 6px;
            font-weight: bold;
            font-size: 14px;
            min-height: 20px;
        }

        .extra-fields {
            display: none;
            background: #fff8e1;
            border: 1px dashed #ffa000;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .extra-fields .form-group:last-child {
            margin-bottom: 0;
        }

        /* 貼上與拖曳上傳框 */
        .drop-zone {
            border: 2px dashed #1976d2;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            background: #f8fbff;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            background: #e3f2fd;
            border-color: #0d47a1;
        }

        .drop-zone-text {
            font-size: 15px;
            color: #1976d2;
            font-weight: bold;
            line-height: 1.6;
        }

        .drop-zone-subtext {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        #previewBox {
            display: none;
            margin-top: 12px;
            text-align: center;
        }

        #previewBox img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 6px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.submit-btn:hover {
            background: #1565c0;
        }

        button.submit-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        /* 控制 SweetAlert 頂部距離 */
        .custom-top-swal {
            margin-top: 45px !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25) !important;
        }
    </style>
</head>

<body>

    <div class="form-group">
        <label for="courseDate">上課日期（僅顯示已開放日期）：</label>
        <select id="courseDate"></select>
    </div>

    <div class="form-group">
        <label for="studentId">學號（完整 10 碼）：</label>
        <input type="text" id="studentId" maxlength="10" placeholder="例如：3311531001" autocomplete="off">
        <div id="studentTip"></div>
    </div>

    <!-- 未在名冊中的同學手動補填框 -->
    <div id="extraFields" class="extra-fields">
        <p style="margin: 0 0 10px; color: #e65100; font-size: 13px; font-weight: bold;">
            ⚠️ 名冊中查無此學號（選修/外系生），請手動補填基本資料：
        </p>
        <div class="form-group">
            <label for="customName">學生姓名：</label>
            <input type="text" id="customName" placeholder="請輸入真實姓名">
        </div>
        <div class="form-group">
            <label for="customClass">所屬班級：</label>
            <input type="text" id="customClass" placeholder="例如：資管二A、企管三B">
        </div>
    </div>

    <div class="form-group">
        <label>作業截圖（支援 Ctrl+V 貼上 / 檔案選取 / 拖曳）：</label>
        <div class="drop-zone" id="dropZone" onclick="triggerFileInput()">
            <div class="drop-zone-text">📋 點擊選擇檔案，或直接按 <code>Ctrl + V</code> 貼上截圖</div>
            <div class="drop-zone-subtext">也支援將圖片檔案拖曳至此處（自動轉為 JPG）</div>
            <!-- 隱藏原生檔案選取器，由點擊或程式觸發 -->
            <input type="file" id="imageFile" accept="image/*" style="display: none;">
        </div>

        <div id="previewBox">
            <img id="imagePreview" alt="作業截圖預覽">
            <p style="font-size: 12px; color: #666; margin: 4px 0 0;">✓ 圖片已載入，可再次貼上或點擊替換</p>
        </div>
    </div>

    <button id="submitBtn" class="submit-btn" onclick="submitHomework()">確認並送出繳交</button>

    <script src="config.js"></script>
    <script>
        // 建立全域統一的靠頂彈窗
        const MySwal = Swal.mixin({
            position: "top",
            customClass: {
                popup: "custom-top-swal"
            }
        });

        let userIP = "未知";
        let isManualInput = false;
        let currentStudentName = "";
        let currentClassName = "";
        let currentImageBlob = null; // 儲存當前選取或貼上的圖片 Blob

        fetch("https://api.ipify.org?format=json")
            .then(res => res.json())
            .then(data => { userIP = data.ip; })
            .catch(() => { userIP = "獲取失敗"; });

        document.addEventListener("DOMContentLoaded", () => {
            initCourseDateSelect("courseDate");
        });

        const studentInput = document.getElementById("studentId");
        const tip = document.getElementById("studentTip");
        const extraFields = document.getElementById("extraFields");
        const fileInput = document.getElementById("imageFile");
        const dropZone = document.getElementById("dropZone");
        const previewBox = document.getElementById("previewBox");
        const previewImg = document.getElementById("imagePreview");

        // 觸發隱藏的 file input
        function triggerFileInput() {
            fileInput.click();
        }

        // 監聽學號輸入：即時驗證名單
        studentInput.addEventListener("input", (e) => {
            const val = e.target.value.trim();

            if (val.length === 10) {
                if (STUDENTS[val]) {
                    isManualInput = false;
                    currentStudentName = STUDENTS[val].name;
                    currentClassName = STUDENTS[val].className;
                    extraFields.style.display = "none";
                    tip.style.color = "#2e7d32";
                    tip.innerText = `✓ 確認身分：${currentStudentName} 同學（${currentClassName}）`;
                } else {
                    isManualInput = true;
                    currentStudentName = "";
                    currentClassName = "";
                    extraFields.style.display = "block";
                    tip.style.color = "#e65100";
                    tip.innerText = "ℹ️ 非本班名冊名單，請於下方手動填寫「姓名」與「班級」";
                }
            } else {
                isManualInput = false;
                extraFields.style.display = "none";
                currentStudentName = "";
                currentClassName = "";
                tip.innerText = val.length > 0 ? `已輸入 ${val.length}/10 碼...` : "";
            }
        });

        // 統一處理圖片顯示
        function handleImageBlob(blob) {
            currentImageBlob = blob;
            previewImg.src = URL.createObjectURL(blob);
            previewBox.style.display = "block";
        }

        // 1. 檔案選取上傳監聽
        fileInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file) {
                handleImageBlob(file);
            }
        });

        // 2. 剪貼簿「複製貼上 (Ctrl+V)」監聽
        window.addEventListener("paste", function (e) {
            // 如果游標正在打字（學號或姓名欄位），避免誤攔截文字貼上
            if (e.target.tagName === "INPUT" && e.target.type === "text") {
                // 如果剪貼簿裡不是圖片，就放行一般文字貼上
                const hasImage = Array.from(e.clipboardData.items).some(item => item.type.indexOf("image") !== -1);
                if (!hasImage) return;
            }

            const items = (e.clipboardData || window.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf("image") !== -1) {
                    const blob = items[i].getAsFile();
                    handleImageBlob(blob);
                    
                    // 貼上成功時給予微提示
                    const originalText = dropZone.querySelector(".drop-zone-text").innerText;
                    dropZone.querySelector(".drop-zone-text").innerText = "📋 已成功從剪貼簿貼上圖片！";
                    setTimeout(() => {
                        dropZone.querySelector(".drop-zone-text").innerHTML = "📋 點擊選擇檔案，或直接按 <code>Ctrl + V</code> 貼上截圖";
                    }, 2500);
                    break;
                }
            }
        });

        // 3. 拖曳檔案支援 (Drag & Drop)
        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith("image/")) {
                handleImageBlob(file);
            }
        });

        // 送出繳交作業
        async function submitHomework() {
            const id = studentInput.value.trim();
            const date = document.getElementById("courseDate").value;
            const btn = document.getElementById("submitBtn");

            if (!date) {
                MySwal.fire({
                    icon: "warning",
                    title: "提示",
                    text: "目前尚無可選的上課日期或未開放！",
                    confirmButtonColor: "#1976d2"
                });
                return;
            }

            if (id.length !== 10) {
                MySwal.fire({
                    icon: "warning",
                    title: "學號不完整",
                    text: "請填寫正確且完整的 10 碼學號！",
                    confirmButtonColor: "#1976d2"
                });
                return;
            }

            if (isManualInput) {
                currentStudentName = document.getElementById("customName").value.trim();
                currentClassName = document.getElementById("customClass").value.trim();
                if (!currentStudentName || !currentClassName) {
                    MySwal.fire({
                        icon: "warning",
                        title: "資料未完整",
                        text: "請完整填寫手動補填的「姓名」與「班級」！",
                        confirmButtonColor: "#1976d2"
                    });
                    return;
                }
            }

            // 檢查是否有選取或貼上圖片
            if (!currentImageBlob) {
                MySwal.fire({
                    icon: "warning",
                    title: "請提供作業截圖",
                    text: "請選擇圖片檔案，或按 Ctrl+V 貼上截圖！",
                    confirmButtonColor: "#1976d2"
                });
                return;
            }

            // 確認視窗
            const confirmResult = await MySwal.fire({
                title: "確認繳交作業？",
                html: `
                    <div style="text-align: left; font-size: 14px; background: #f8f9fa; padding: 12px; border-radius: 6px; line-height: 1.8;">
                        <b>📅 上課日期：</b> ${date}<br>
                        <b>🆔 學生學號：</b> ${id}<br>
                        <b>👤 學生姓名：</b> ${currentStudentName}<br>
                        <b>🏫 所屬班級：</b> ${currentClassName}<br>
                        <hr style="border: none; border-top: 1px dashed #ccc; margin: 8px 0;">
                        <span style="color: #e65100;">⚠️ 若當日已有繳交紀錄，新檔案將自動覆蓋舊作業。</span>
                    </div>
                `,
                icon: "question",
                showCancelButton: true,
                confirmButtonText: "確定送出",
                cancelButtonText: "取消",
                confirmButtonColor: "#1976d2",
                cancelButtonColor: "#757575"
            });

            if (!confirmResult.isConfirmed) return;

            // Loading 視窗
            MySwal.fire({
                title: "上傳中...",
                text: "正在上傳資料，請稍候",
                allowOutsideClick: false,
                allowEscapeKey: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            btn.disabled = true;

            const img = new Image();
            const reader = new FileReader();

            reader.onload = function (e) {
                img.src = e.target.result;
                img.onload = async function () {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");

                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);

                    const jpegBase64 = canvas.toDataURL("image/jpeg", 0.92);

                    const payload = {
                        courseDate: date,
                        studentId: id,
                        studentName: currentStudentName,
                        className: currentClassName,
                        clientIP: userIP,
                        image: jpegBase64
                    };

                    try {
                        const res = await fetch(GAS_URL, {
                            method: "POST",
                            body: JSON.stringify(payload)
                        });
                        const result = await res.json();

                        if (result.status === "success") {
                            await MySwal.fire({
                                icon: "success",
                                title: "繳交成功！",
                                html: `
                                    <b>檔名：</b>${result.fileName}<br>
                                    <b>狀態：</b>${result.overwritten ? "<span style='color:#e65100;'>已成功覆蓋舊作業</span>" : "<span style='color:#2e7d32;'>新作業已建立</span>"}<br>
                                    <b>更新時間：</b>${result.updatedTime}
                                `,
                                confirmButtonColor: "#1976d2"
                            });
                            location.reload();
                        } else {
                            MySwal.fire({
                                icon: "error",
                                title: "上傳失敗",
                                text: result.message || "系統回傳錯誤，請聯絡管理員！",
                                confirmButtonColor: "#1976d2"
                            });
                        }
                    } catch (err) {
                        await MySwal.fire({
                            icon: "info",
                            title: "資料已送出",
                            text: "連線狀態已確認，請至清單預覽確認作業是否呈現！",
                            confirmButtonColor: "#1976d2"
                        });
                        location.reload();
                    } finally {
                        btn.disabled = false;
                    }
                };
            };
            reader.readAsDataURL(currentImageBlob);
        }
    </script>
</body>

</html>
